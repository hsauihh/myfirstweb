# nginx 站点配置模板：把 YOUR_DOMAIN 替换成你的域名
# 用法见 DEPLOY.md 第 6 步；HTTPS 由 certbot --nginx 自动改写本文件。

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/zero-to-full;
    index index.html;

    # 头像上传最大 2MB，留出余量
    client_max_body_size 5m;

    # 压缩：JS/CSS/JSON/SVG 文本类资源；字体（woff2）本身已压缩，不要再压
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Next 构建产物带内容哈希，可以永久缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 字体 / 图片等静态资源
    location ~* \.(?:woff2|ttf|otf|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML 与 RSC payload（*.txt）必须回源校验，否则发布后拿不到新版
    location ~* \.(?:html|txt)$ {
        add_header Cache-Control "no-cache";
    }

    # 前端静态资源（Next 静态导出为扁平 .html，需 $uri.html 回退）
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 后端 API（含 AI 流式接口，关闭缓冲保证 SSE 实时输出）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 用户头像
    location /avatars/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 好友 WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
